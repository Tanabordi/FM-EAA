name: fm_eaa
description: "Smart Fridge Inventory & Expiry Alert App (FM-EAA)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local Database (Drift / SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & Sync
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Security & Auth
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1

  # Media & Hardware
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.1+2

  # Localization & Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
