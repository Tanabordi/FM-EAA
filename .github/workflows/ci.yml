name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        env:
          PORT: ${{ secrets.PORT }}
          NODE_ENV: test
          # ส่งครอบคลุมทั้ง 2 รูปแบบชื่อตัวแปร
          ORACLE_USER: ${{ secrets.ORACLE_DB_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
          ORACLE_CONNECT_STRING: ${{ secrets.ORACLE_DB_CONNECT_STRING }}
          ORACLE_DB_USER: ${{ secrets.ORACLE_DB_USER }}
          ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
          ORACLE_DB_CONNECT_STRING: ${{ secrets.ORACLE_DB_CONNECT_STRING }}
          ORACLE_DB_SCHEMA: ${{ secrets.ORACLE_DB_SCHEMA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OCI_PAR_URL: ${{ secrets.OCI_PAR_URL }}
        run: npm test

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests with Coverage (Automated Testing)
        run: flutter test --coverage

      - name: Setup google-services.json for CI Build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "6402963456",
              "project_id": "fm-eaa",
              "storage_bucket": "fm-eaa.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:6402963456:android:78100af4b7ec3d1adf00e5",
                  "android_client_info": {
                    "package_name": "com.fmeaa.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_ci_build_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Android APK (Automated Build)
        run: flutter build apk --debug
